# Advisories accepted as upstream risk. Both arrive only through Tauri 2's
# Linux GTK3 stack (tauri -> muda/tao/wry -> gtk 0.18 -> glib 0.18) and
# clear once Tauri moves to gtk-rs >= 0.20 (expected with Tauri 3).
[advisories]
ignore = [
  # glib 0.18 VariantStrIter unsoundness; SpreadGL2 never calls VariantStrIter.
  "RUSTSEC-2024-0429",
  # proc-macro-error unmaintained; build-time only, via glib-macros 0.18.
  "RUSTSEC-2024-0370",
]
