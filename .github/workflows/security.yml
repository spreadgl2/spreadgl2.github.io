name: Dependency security

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - .github/workflows/security.yml
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - .github/workflows/security.yml
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm production advisory audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  rust-audit:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # Accepted upstream risk: both arrive only through Tauri 2's Linux GTK3
          # stack (tauri -> muda/tao/wry -> gtk 0.18 -> glib 0.18). Remove once
          # Tauri adopts gtk-rs >= 0.20 (expected with Tauri 3).
          # RUSTSEC-2024-0429: glib VariantStrIter unsoundness; never called here.
          # RUSTSEC-2024-0370: proc-macro-error unmaintained; build-time only.
          ignore: RUSTSEC-2024-0429,RUSTSEC-2024-0370
