name: Stress and performance

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      run_e2e_perf:
        description: 'Also run the Playwright frame-time and memory budgets (slow)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stress:
    name: vitest perf budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Perf budget
        run: pnpm test:stress

  e2e-perf:
    name: playwright frame-time budgets
    if: github.event_name != 'workflow_dispatch' || inputs.run_e2e_perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Serialized frame-time, constrained-profile, and memory budgets
        run: pnpm test:e2e:perf
