name: Stress and performance

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      run_e2e_perf:
        description: 'Also run the Playwright frame-time and memory budgets (slow)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stress:
    name: vitest perf budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Perf budget
        run: pnpm test:stress

  e2e-perf:
    name: playwright frame-time budgets
    if: github.event_name != 'workflow_dispatch' || inputs.run_e2e_perf
    # Hosted-runner software rendering is not a stable performance baseline.
    # Preserve the weekly measurements without turning host contention into a
    # failing workflow; tag and explicitly requested runs remain blocking.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Serialized frame-time, constrained-profile, and memory budgets
        run: pnpm test:e2e:perf
